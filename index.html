<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票情報站</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang HK","Microsoft JhengHei",sans-serif;background:#0f1420;color:#e8eaf0;font-size:18px;line-height:1.6;padding:16px;max-width:900px;margin:0 auto}
h1{font-size:28px;margin-bottom:4px}
.sub{color:#8b93a7;font-size:15px;margin-bottom:14px}
.ws-bar{display:flex;justify-content:space-between;align-items:center;background:#161c2b;border:1px solid #232c44;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:15px}
#ws-status{color:#3ddc84;font-weight:600}
.card{background:#161c2b;border:1px solid #232c44;border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-size:22px;margin-bottom:10px}
.cn{font-size:15px;color:#8b93a7;font-weight:400}
.price{font-size:34px;font-weight:700}
.up{color:#3ddc84}.dn{color:#ff6b6b}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.metric{background:#1a2132;border-radius:10px;padding:10px 14px}
.metric .k{font-size:14px;color:#8b93a7}
.metric .v{font-size:20px;font-weight:600}
.metric .v.sm{font-size:16px}
canvas{width:100%;height:260px;background:#0f1420;border-radius:10px;margin-top:10px}
.lg{font-size:14px;color:#8b93a7;margin-top:6px}
.news-item{border-top:1px solid #232c44;padding:12px 0}
.news-item:first-child{border-top:none}
.news-item a{color:#7db4ff;text-decoration:none;font-size:17px}
.news-item .meta{font-size:14px;color:#8b93a7;margin-top:4px}
.sent{display:inline-block;font-size:14px;padding:2px 10px;border-radius:20px;margin-left:8px}
.sent-pos{background:rgba(61,220,132,.15);color:#3ddc84}
.sent-neg{background:rgba(255,107,107,.15);color:#ff6b6b}
.sent-neu{background:rgba(139,147,167,.15);color:#8b93a7}
.loading{text-align:center;color:#8b93a7;padding:30px;font-size:18px}
.verdict{font-size:20px;padding:14px;border-radius:10px;margin-top:12px;text-align:center;font-weight:600}
.v-bull{background:rgba(61,220,132,.12);color:#3ddc84}
.v-bear{background:rgba(255,107,107,.12);color:#ff6b6b}
.v-neutral{background:rgba(139,147,167,.12);color:#aab2c5}
.note{font-size:14px;color:#8b93a7;margin-top:16px;text-align:center}
.idx-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.idx{background:#161c2b;border:1px solid #232c44;border-radius:12px;padding:12px 14px}
.idx .n{font-size:15px;color:#8b93a7}
.idx .p{font-size:24px;font-weight:700}
.idx .c{font-size:16px;font-weight:600}
.wl-row{display:flex;align-items:center;gap:12px;background:#161c2b;border:1px solid #232c44;border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.wl-row:active{background:#1a2132}
.wl-sym{font-size:20px;font-weight:700;min-width:70px}
.wl-spark{flex:1}
.wl-px{text-align:right;min-width:90px}
.wl-px .lp{font-size:20px;font-weight:700}
.wl-px .lp.flash{animation:fl .6s}
@keyframes fl{0%{background:rgba(47,124,246,.5)}100%{background:transparent}}
.wl-chg{font-size:15px;font-weight:600}
.wl-x{background:none;border:none;color:#8b93a7;font-size:24px;cursor:pointer;padding:0 4px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.toolbar input{flex:1;min-width:140px;font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid #2a3348;background:#1a2132;color:#fff}
button{font-size:18px;padding:10px 20px;border-radius:10px;border:none;background:#2f7cf6;color:#fff;cursor:pointer}
button:active{background:#2568d8}
button.ghost{background:#1a2132;border:1px solid #2a3348;font-size:15px;padding:8px 14px}
.sort-btn{background:#1a2132;border:1px solid #2a3348;font-size:15px;padding:8px 14px}
.sort-btn.active{background:#2f7cf6;border-color:#2f7cf6}
.back{background:#1a2132;border:1px solid #2a3348;font-size:16px;padding:8px 16px}
.live-tag{font-size:14px;margin:6px 0;color:#8b93a7}
.alert-box{margin-top:14px;background:#1a2132;border-radius:10px;padding:12px 14px}
.alert-box .k{font-size:16px;font-weight:600;margin-bottom:8px}
.alert-row{display:flex;gap:8px}
.alert-row input{flex:1;font-size:18px;padding:10px 12px;border-radius:10px;border:1px solid #2a3348;background:#0f1420;color:#fff}
.hint{font-size:13px;color:#8b93a7;margin-top:6px}
.set-row{display:flex;gap:8px;margin-top:8px}
.set-row input{flex:1;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid #2a3348;background:#0f1420;color:#fff}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:12px;font-size:18px;background:#161c2b;border:1px solid #232c44;border-radius:12px;cursor:pointer;color:#8b93a7}
.tab.active{background:#2f7cf6;color:#fff;border-color:#2f7cf6}
.hidden{display:none}
</style>
</head>
<body>
<h1>📈 股票情報站</h1>
<div class="sub">新聞＋技術指標＋即時串流（<span id="updated">載入中…</span>更新）</div>
<div class="ws-bar"><span>⚡ 即時串流</span><span id="ws-status">連接中…</span></div>
<div class="tabs">
  <div class="tab active" onclick="showTab('home')">🏠 主頁</div>
  <div class="tab" onclick="showTab('settings')">⚙️ 設定</div>
</div>

<div id="tab-home">
  <div class="idx-grid" id="indices"></div>
  <div class="toolbar">
    <input type="text" id="add-input" placeholder="加 ticker，例如 TSM" autocapitalize="characters">
    <button onclick="addTicker()">新增</button>
  </div>
  <div class="toolbar">
    <span style="font-size:15px;color:#8b93a7">排序：</span>
    <button class="sort-btn active" data-m="default" onclick="setSort('default')">預設</button>
    <button class="sort-btn" data-m="chg" onclick="setSort('chg')">升跌</button>
    <button class="sort-btn" data-m="name" onclick="setSort('name')">名稱</button>
  </div>
  <div id="watchlist-body"></div>
  <div id="detail"></div>
</div>

<div id="tab-settings" class="hidden">
  <div class="card">
    <h2>⚙️ 設定</h2>
    <div style="font-size:16px;margin-bottom:6px">Finnhub API Key（即時串流用）</div>
    <div class="set-row">
      <input type="password" id="fh-key" placeholder="貼入 finnhub.io 免費 key">
      <button onclick="saveKey()">儲存</button>
    </div>
    <div class="hint" style="margin-top:8px">狀態：<span id="key-status">未設定</span></div>
    <div class="hint">去 finnhub.io 免費申請，唔使綁信用卡。Key 只存喺呢部機嘅瀏覽器，唔會上傳去任何地方。</div>
  </div>
  <div class="card">
    <h2>ℹ️ 關於</h2>
    <div class="hint">股價歷史＋新聞：每小時自動更新<br>即時報價：Finnhub WebSocket 串流（開市時段逐秒）<br>技術指標喺瀏覽器即時計算<br><br>僅供研究參考，唔係買賣建議。</div>
  </div>
</div>

<div class="note">數據每小時更新｜即時串流需設定 Finnhub key｜僅供研究參考，唔係買賣建議</div>
<script>
function showTab(t){
  document.querySelectorAll(".tab").forEach(el=>el.classList.remove("active"));
  event.target.classList.add("active");
  $("tab-home").classList.toggle("hidden",t!=="home");
  $("tab-settings").classList.toggle("hidden",t!=="settings");
}
</script>
<script src="app.js"></script>
</body>
</html>
